name: Trial Library
description: 'Trial Library is an AI-native oncology clinical trials technology company that integrates
  clinical trials into routine cancer care. Its provider-facing decision-support platform helps community
  oncology practices and health systems identify eligible patients and match them to open trials at the
  point of care, while a navigation layer supports patients through enrollment and completion by
  proactively addressing transportation, food, language, and scheduling barriers. Trial Library works
  across health systems, biopharma sponsors, and research sites to expand equitable access to cancer
  clinical trials. The company was added to the API Evangelist network as a portfolio company of
  lux-capital.'
